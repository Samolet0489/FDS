version: '3.9'

services:
  db:
    image: postgres:15
    container_name: ds-postgres
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=transactions_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  auth_service:
    build: ./auth_service  # directory with Dockerfile + auth_main.py
    container_name: ds-auth-service
    ports:
      - "5001:5001"


  transaction_service:
    build: ./transaction_service 
    container_name: ds-transaction-service
    ports:
      - "5002:5002"
    depends_on:
      - db
      - auth_service
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: transactions_db
      AUTH_SERVICE_URL: http://host.docker.internal:5001 

volumes:
  db_data:

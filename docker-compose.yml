version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ds-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: transactions_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  auth_service:
    build: ./auth_service
    container_name: ds-auth-service
    ports:
      - "5001:5001"

  transaction_service:
    build: ./transaction_service
    container_name: ds-transaction-service
    ports:
      - "5002:5002"
    depends_on:
      - db
      - auth_service
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: transactions_db
      # Use internal Docker DNS name for auth_service
      AUTH_SERVICE_URL: http://auth_service:5001

  message_queue_service:
    build: ./message_queue_service
    container_name: ds-queue-service
    ports:
      - "7500:7500"
    depends_on:
      - auth_service
    environment:
      # Point at the auth_service by its service name
      AUTH_SERVICE_URL: http://auth_service:5001

  mpi_prediction_service:
    build: ./mpi_prediction_service
    container_name: ds-mpi-service
    depends_on:
      - auth_service
      - message_queue_service
    environment:
      MQ_URL:             http://message_queue_service:7500
      AUTH_SERVICE_URL:   http://auth_service:5001
      MQ_USER:            agent
      MQ_PASSWORD:        agentpass
      TRANSACTION_QUEUE:  transactions
      RESULTS_QUEUE:      results
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
      
    command: >
      bash -lc "mpiexec --allow-run-as-root -n 5 python mpi_service.py"
    
    
volumes:
  db_data:
